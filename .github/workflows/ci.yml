name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # release.yml dispatches this on changeset-release/main after it creates or
  # updates the Version Packages PR. That PR is opened by github-actions[bot],
  # so its pull_request run waits for manual approval and never creates the
  # Check (Bun) job; a GITHUB_TOKEN workflow_dispatch run does not wait.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check (Bun)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      # Bun blocks dependency lifecycle scripts unless they are listed under
      # trustedDependencies, which is the posture `npm ci --ignore-scripts`
      # used to provide. The root `prepare` script still runs, so this step
      # also exercises the bundle build.
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test:coverage
      - run: bun audit --audit-level=high
