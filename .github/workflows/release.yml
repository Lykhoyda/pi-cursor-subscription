name: Release

# Pending changesets → Version PR. After that PR merges, tag vX.Y.Z and
# workflow_dispatch publish.yml (OIDC trusted publisher). Do not npm publish
# from this file — npm matches the workflow filename on the trusted publisher.
on:
  push:
    branches: ["main"]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3

      - run: bun install --frozen-lockfile

      - name: Create or update the Version Packages PR
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: bun run changeset:version
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
          create-github-releases: false
          push-git-tags: false

      - name: Run CI on the Version Packages PR head
        if: steps.changesets.outputs.pr-number != ''
        # The bot-opened PR's pull_request run is held for approval, so
        # dispatch Check (Bun) on the release branch; its check run lands on
        # the PR head commit.
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: changeset-release/${{ github.ref_name }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$RELEASE_BRANCH"

      - name: Tag unpublished version and dispatch npm publish
        if: steps.changesets.outputs.has-changesets != 'true'
        # Script still no-ops unless HEAD (or merge second parent) is
        # "chore: version packages", so ordinary changeset-free pushes skip.
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci-tag-and-dispatch-npm.sh
