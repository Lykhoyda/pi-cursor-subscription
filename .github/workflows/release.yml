name: Release

# Pending changesets → Version PR. After that PR merges, tag vX.Y.Z and
# workflow_dispatch publish.yml (OIDC trusted publisher). Do not npm publish
# from this file — npm matches the workflow filename on the trusted publisher.
on:
  push:
    branches: ["main"]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - run: bun install --frozen-lockfile

      - name: Create or update the Version Packages PR
        id: changesets
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          version-script: bun run changeset:version
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
          create-github-releases: false
          push-git-tags: false

      - name: Tag unpublished version and dispatch npm publish
        if: steps.changesets.outputs.has-changesets != 'true'
        # Script still no-ops unless HEAD (or merge second parent) is
        # "chore: version packages", so ordinary changeset-free pushes skip.
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci-tag-and-dispatch-npm.sh
