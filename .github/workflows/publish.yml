name: Publish Package to npm

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      # No registry-url: that writes _authToken + dummy NODE_AUTH_TOKEN and blocks OIDC.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: bun install --frozen-lockfile
      - run: bun run check

      - name: Publish to npm (skip if version already exists)
        run: |
          set -euo pipefail
          NAME="$(bun --print "require('./package.json').name")"
          VERSION="$(bun --print "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME#v}"

          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::tag v$TAG != package.json $VERSION"
            exit 1
          fi

          if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "${NAME}@${VERSION} already on npm; skip."
            exit 0
          fi

          npm publish
